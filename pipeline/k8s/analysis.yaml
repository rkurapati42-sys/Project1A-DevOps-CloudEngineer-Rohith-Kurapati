apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-and-latency
  namespace: production
spec:
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(istio_requests_total{reporter="destination",destination_service_name="novapay-core",response_code!~"5.*"}[2m])) 
            / 
            sum(rate(istio_requests_total{reporter="destination",destination_service_name="novapay-core"}[2m]))

    - name: latency-p99
      interval: 30s
      successCondition: result[0] <= 200
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name="novapay-core"}[2m])) by (le))
