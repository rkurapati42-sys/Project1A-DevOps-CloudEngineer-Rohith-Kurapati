apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novapay-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rkurapati42-sys/Project1A-DevOps-CloudEngineer-Rohith-Kurapati.git
    targetRevision: main
    path: pipeline/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
