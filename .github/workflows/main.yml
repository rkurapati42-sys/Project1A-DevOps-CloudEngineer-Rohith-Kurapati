name: NovaPay Zero-Downtime CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/**', 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "1-2 Build, Unit Test and Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build, test and generate coverage
        working-directory: app
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-and-coverage-reports
          path: |
            app/target/surefire-reports/**
            app/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  sonarqube:
    name: "3 Self-hosted SonarQube Quality Gate"
    needs: build-and-test
    runs-on: ${{ vars.SONAR_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Add repository secret SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "::error::Add repository variable SONAR_HOST_URL"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Add repository variable SONAR_PROJECT_KEY"; exit 1; }
          case "$SONAR_HOST_URL" in
            https://*) ;;
            http://*) echo "::warning::SONAR_HOST_URL uses HTTP; use HTTPS for production deployments" ;;
            *) echo "::error::SONAR_HOST_URL must include http:// or https://"; exit 1 ;;
          esac
          case "$SONAR_HOST_URL" in
            *sonarcloud.io*) echo "::error::Configure the self-hosted SonarQube server URL, not SonarCloud"; exit 1 ;;
          esac
      - name: Run SonarQube analysis and wait for Quality Gate
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn -B --no-transfer-progress clean verify             org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar             -Dsonar.host.url="$SONAR_HOST_URL"             -Dsonar.projectKey="$SONAR_PROJECT_KEY"             -Dsonar.token="$SONAR_TOKEN"             -Dsonar.qualitygate.wait=true             -Dsonar.qualitygate.timeout=300

  codeql:
    name: "4 SAST - CodeQL"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile Java application for analysis
        working-directory: app
        run: mvn -B --no-transfer-progress -DskipTests compile
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  security:
    name: "5 Security - Secrets and Dependencies"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan filesystem and dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  compliance:
    name: "6 Kubernetes Validation and OPA Policy Gate"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Kubernetes YAML syntax
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(list(Path("pipeline/k8s").glob("*.yaml")) +
                         list(Path("pipeline/k8s").glob("*.yml")))
          if not files:
              raise SystemExit("No Kubernetes YAML manifests found")
          for path in files:
              documents = list(yaml.safe_load_all(path.read_text()))
              if not documents or any(doc is None for doc in documents):
                  raise SystemExit(f"Empty YAML document in {path}")
              print(f"Validated YAML: {path}")
          PY
      - name: Install pinned Conftest
        run: |
          curl --fail --silent --show-error --location             https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz             | tar -xz
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version
      - name: Evaluate OPA policies against Kubernetes manifests
        run: conftest test pipeline/k8s --policy pipeline/policies/compliance.rego

  container-security:
    name: "7 Container Build, Vulnerability Scan and SBOM"
    needs: [sonarqube, codeql, security, compliance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Package application for container build
        working-directory: app
        run: mvn -B --no-transfer-progress clean package -DskipTests
      - name: Build local container image
        run: |
          docker build --pull --tag novapay:${GITHUB_SHA} app
      - name: Scan container image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: novapay:${{ github.sha }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: novapay:${{ github.sha }}
          format: cyclonedx
          output: novapay-image.cdx.json
          exit-code: '0'
      - name: Upload container SBOM
        uses: actions/upload-artifact@v7
        with:
          name: novapay-container-sbom
          path: novapay-image.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish-ghcr:
    name: "8 Publish, Attest and Sign Image in GHCR"
    needs: container-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Package application for container build
        working-directory: app
        run: mvn -B --no-transfer-progress clean package -DskipTests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/novapay:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=NovaPay application image
          sbom: true
          provenance: mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign published image by digest (keyless OIDC)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novapay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record published image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novapay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image: ${IMAGE}:${GITHUB_SHA}"
          echo "Immutable digest: ${IMAGE}@${DIGEST}"

