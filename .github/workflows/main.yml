name: NovaPay Zero-Downtime CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novapay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "1-2 Build, Unit Test and API Contract Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build, test and generate coverage
        working-directory: app
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload reusable Maven build output
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-output
          path: app/target/
          if-no-files-found: error
          retention-days: 1
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-and-coverage-reports
          path: |
            app/target/surefire-reports/**
            app/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  sonarqube:
    name: "3 Self-hosted SonarQube Quality Gate"
    # Temporarily opt-in; set repository variable ENABLE_SONARQUBE=true to re-enable.
    if: ${{ vars.ENABLE_SONARQUBE == 'true' }}
    needs: build-and-test
    runs-on: ${{ vars.SONAR_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Reuse compiled classes and JaCoCo report
        uses: actions/download-artifact@v7
        with:
          name: maven-build-output
          path: app/target/
      - name: Verify SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Add repository secret SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "::error::Add repository variable SONAR_HOST_URL"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Add repository variable SONAR_PROJECT_KEY"; exit 1; }
          case "$SONAR_HOST_URL" in
            https://*) ;;
            http://*) echo "::warning::SONAR_HOST_URL uses HTTP; use HTTPS for production deployments" ;;
            *) echo "::error::SONAR_HOST_URL must include http:// or https://"; exit 1 ;;
          esac
          case "$SONAR_HOST_URL" in
            *sonarcloud.io*) echo "::error::Configure the self-hosted SonarQube server URL, not SonarCloud"; exit 1 ;;
          esac
          test -d app/target/classes || { echo "::error::Compiled classes missing from Maven artifact"; exit 1; }
          test -f app/target/site/jacoco/jacoco.xml || { echo "::error::JaCoCo report missing from Maven artifact"; exit 1; }
      - name: Run SonarQube analysis and wait for Quality Gate
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn -B --no-transfer-progress             org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar             -Dsonar.host.url="$SONAR_HOST_URL"             -Dsonar.projectKey="$SONAR_PROJECT_KEY"             -Dsonar.token="$SONAR_TOKEN"             -Dsonar.java.binaries=target/classes             -Dsonar.java.test.binaries=target/test-classes             -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml             -Dsonar.qualitygate.wait=true             -Dsonar.qualitygate.timeout=300

  codeql:
    name: "4 SAST - CodeQL"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile Java application for analysis
        working-directory: app
        run: mvn -B --no-transfer-progress -DskipTests compile
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  security:
    name: "5 Security - Secrets and Dependencies"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full Git history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan filesystem and dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  dast:
    name: "6 DAST - OWASP ZAP Baseline"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Download tested application artifact
        uses: actions/download-artifact@v7
        with:
          name: maven-build-output
          path: app/target/
      - name: Start NovaPay for dynamic security testing
        run: |
          java -jar app/target/novapay-1.0.0.jar > /tmp/novapay-dast.log 2>&1 &
          APP_PID=$!
          echo "$APP_PID" > /tmp/novapay-dast.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "NovaPay is healthy and ready for DAST"
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/novapay-dast.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/novapay-dast.log
          echo "::error::NovaPay did not become healthy within 120 seconds"
          exit 1
      - name: Run OWASP ZAP passive baseline scan
        run: |
          docker run --rm --network host             -v "$PWD:/zap/wrk/:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t http://127.0.0.1:8080 -m 3 -I -r zap-baseline.html
      - name: Stop NovaPay
        if: always()
        run: |
          if [ -f /tmp/novapay-dast.pid ]; then
            kill "$(cat /tmp/novapay-dast.pid)" 2>/dev/null || true
          fi
      - name: Upload OWASP ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novapay-zap-baseline-report
          path: zap-baseline.html
          if-no-files-found: warn
          retention-days: 14

  compliance:
    name: "7 Kubernetes Schema and OPA Policy Gates"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Kubernetes YAML syntax
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(
              path for path in Path("pipeline/k8s").glob("*")
              if path.suffix in {".yaml", ".yml"} and path.name != "kustomization.yaml"
          )
          if not files:
              raise SystemExit("No Kubernetes YAML manifests found")
          for path in files:
              documents = list(yaml.safe_load_all(path.read_text()))
              if not documents or any(doc is None for doc in documents):
                  raise SystemExit(f"Empty YAML document in {path}")
              print(f"Validated YAML: {path}")
          PY
      - name: Install kubeconform
        run: |
          curl --fail --silent --show-error --location             https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz             | tar -xz
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate Kubernetes API schemas
        run: |
          find pipeline/k8s -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name 'kustomization.yaml' -print0             | xargs -0 kubeconform -strict -ignore-missing-schemas
      - name: Install pinned Conftest
        run: |
          curl --fail --silent --show-error --location             https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz             | tar -xz
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version
      - name: Evaluate OPA policies against Kubernetes manifests
        run: conftest test pipeline/k8s --policy pipeline/policies/compliance.rego

  container-security:
    name: "8 Container Build, Vulnerability Scan and SBOM"
    needs: [codeql, security, dast, compliance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download tested Maven artifact
        uses: actions/download-artifact@v7
        with:
          name: maven-build-output
          path: app/target/
      - name: Build local container image
        run: docker build --pull --tag novapay:${{ github.sha }} app
      - name: Scan container image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: novapay:${{ github.sha }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: novapay:${{ github.sha }}
          format: cyclonedx
          output: novapay-image.cdx.json
          exit-code: '0'
      - name: Upload container SBOM
        uses: actions/upload-artifact@v7
        with:
          name: novapay-container-sbom
          path: novapay-image.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish-ghcr:
    name: "9 Publish, Attest and Sign Image in GHCR"
    needs: container-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download tested Maven artifact
        uses: actions/download-artifact@v7
        with:
          name: maven-build-output
          path: app/target/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/novapay:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=NovaPay application image
          sbom: true
          provenance: mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign published image by digest (keyless OIDC)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novapay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify signed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novapay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}"             --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*"             --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
      - name: Record published image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novapay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image: ${IMAGE}:${GITHUB_SHA}"
          echo "Immutable digest: ${IMAGE}@${DIGEST}"
