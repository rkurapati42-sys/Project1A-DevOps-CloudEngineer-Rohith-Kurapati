name: NovaPay Zero-Downtime CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: "1-2 Build and Unit Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        working-directory: ./app
        run: mvn -B clean test package

  quality:
    name: "3 Quality Gate"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Maven project
        working-directory: ./app
        run: mvn -B -DskipTests validate

  security:
    name: "4-6 Security and Compliance Checks"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
      - name: Validate policy files exist
        run: |
          test -s pipeline/policies/compliance.rego
          test -s pipeline/policies/no-privileged-containers.rego
      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in Path("pipeline/k8s").glob("*.yml"):
              list(yaml.safe_load_all(p.read_text()))
          print("Kubernetes YAML syntax validation passed")
          PY

  artifact:
    name: "7 Artifact Provenance"
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable build identity
        run: |
          echo "Git SHA: $GITHUB_SHA"
          echo "SemVer release tag must be used for production artifacts."
          echo "Production must never use the latest tag."

  deployment-readiness:
    name: "8 Deployment Readiness"
    needs: artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          test -s pipeline/k8s/rollout.yml
          test -s pipeline/k8s/analysis.yaml
          test -s pipeline/argocd/application.yaml
          echo "Deployment readiness checks passed."
